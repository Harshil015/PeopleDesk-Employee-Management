<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in - Employee Management System</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-screen">
  <form class="login-card" id="loginForm" novalidate>
    <div class="brand">Employee Management System</div>
    <h1>Sign in</h1>

    <div class="error-text" id="errorBox"></div>

    <div class="field">
      <label for="username">Username or email</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="rememberMe" />
      <label for="rememberMe">Remember me</label>
    </div>

    <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>

    <div class="hint-text">
      Demo credentials — username: <strong>admin</strong>, password: <strong>Admin@123</strong>
    </div>
  </form>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
